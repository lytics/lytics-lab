name: Feature Request
description: Propose a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature! Please fill out the sections below.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What's missing or broken?
      placeholder: |
        Currently, there's no way to...
        Users are struggling with...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you solve this problem?
      placeholder: |
        Add a new component that...
        Integrate [tool] to...
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: Who benefits and how?
      placeholder: |
        - **For contributors:** ...
        - **For maintainers:** ...
        - **For users:** ...
    validations:
      required: false

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Overview
      description: High-level steps to implement this (optional)
      placeholder: |
        1. Install dependencies
        2. Configure...
        3. Add workflow...
    validations:
      required: false

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Specific checklist of work items (optional)
      placeholder: |
        - [ ] Create configuration file
        - [ ] Add CI workflow
        - [ ] Update documentation
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information (links, examples, screenshots)
      placeholder: |
        - Similar feature in [project]: link
        - Related discussion: #123
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you willing to work on this?
      options:
        - label: I'd like to work on this issue
        - label: I'm available to help review PRs

